include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

stages:
  - test
  - deploy

pages:
  image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html 404.html robots.txt sitemap.xml llms.txt .nojekyll _headers public/
    - cp manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png secops-discovery-badge.webp public/
    - cp google*.html public/ 2>/dev/null || true
    - cp -r certifications public/
  artifacts:
    expire_in: 1 day
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
